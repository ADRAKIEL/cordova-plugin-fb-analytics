repositories {
    google()
    mavenCentral()
}

ext {
    // SDK configuration synchronized with the main application
    // Defines compileSdk and BuildTools versions with default values (API 35)
    def cdvCompileSdkVersion = privateHelpers.hasProperty('compileSdkVersion') ? compileSdkVersion : 35
    def cdvBuildToolsVersion = privateHelpers.hasProperty('buildToolsVersion') ? buildToolsVersion : '35.0.0'

    // Propagates versions to the project if not already defined
    if (!project.hasProperty('compileSdkVersion')) {
        project.ext.compileSdkVersion = cdvCompileSdkVersion
    }
    if (!project.hasProperty('buildToolsVersion')) {
        project.ext.buildToolsVersion = cdvBuildToolsVersion
    }
}

dependencies {
    // Facebook Android SDK v16.0.1 - Soporte para App Events Analytics
    // Proporciona integración con Meta para tracking de eventos en la aplicación
    implementation 'com.facebook.android:facebook-android-sdk:16.0.1'
}
